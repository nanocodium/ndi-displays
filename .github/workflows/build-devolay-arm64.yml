# Builds Devolay's native library for macOS on Apple Silicon and repacks the stock Devolay jar
# with it, so the mod's NDI binding works on M-series Macs.
#
# Upstream Devolay 2.1.x ships macOS natives for x86-64 only; on an arm64 Java runtime the loader
# looks for natives/macos/arm64-v8a/libdevolay-natives.dylib inside the Devolay jar and gives up.
# This runs on an Apple Silicon runner: it takes Devolay's C++ sources at the pinned tag, the NDI
# SDK for Apple headers, and the JNI headers javac generates from Devolay's own Java classes,
# compiles them with clang for arm64, ad-hoc signs the result (unsigned arm64 code is refused by
# macOS), and adds it to a copy of devolay-2.1.0.jar from Maven Central. The repacked jar is
# committed to thirdparty/ where build.gradle picks it up through a flat-dir repository.
#
# Run it by hand from the Actions tab whenever the Devolay version or the NDI SDK changes.
name: Build Devolay macOS arm64

on:
  workflow_dispatch:
    inputs:
      devolay_tag:
        description: Devolay git tag to build
        default: v2.1.0
      commit:
        description: Commit the repacked jar to thirdparty/ on this branch
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: aarch64

      - name: Fetch Devolay sources
        run: git clone --depth 1 -b "${{ inputs.devolay_tag }}" https://github.com/WalkerKnapp/devolay.git devolay

      - name: Install the NDI SDK for Apple (headers)
        run: |
          curl -sSL -o ndi-sdk.pkg "https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg"
          sudo installer -pkg ndi-sdk.pkg -target /
          ls "/Library/NDI SDK for Apple/include" | head

      - name: Generate JNI headers from Devolay's Java classes
        run: |
          mkdir -p devolay/devolay-natives/src/main/headers gen/classes
          javac -h devolay/devolay-natives/src/main/headers -d gen/classes \
            $(find devolay/devolay-java/src/main/java -name '*.java')
          ls devolay/devolay-natives/src/main/headers

      - name: Compile the arm64 native
        run: |
          mkdir -p deps
          curl -sSL -o deps/filesystem.hpp https://github.com/gulrak/filesystem/releases/download/v1.3.2/filesystem.hpp
          cd devolay/devolay-natives/src/main/cpp
          clang++ -std=c++11 -O2 -fPIC -dynamiclib -arch arm64 -mmacosx-version-min=11.0 \
            -I. -I../headers -I"$GITHUB_WORKSPACE/deps" \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
            -I"/Library/NDI SDK for Apple/include" \
            -o "$GITHUB_WORKSPACE/libdevolay-natives.dylib" *.cpp -ldl
          cd "$GITHUB_WORKSPACE"
          codesign --force -s - libdevolay-natives.dylib
          file libdevolay-natives.dylib
          nm -gU libdevolay-natives.dylib | grep -c Java_me_walkerknapp
          codesign -dv libdevolay-natives.dylib 2>&1 | head -3

      - name: Repack the Devolay jar with the arm64 native
        run: |
          VERSION="${{ inputs.devolay_tag }}"; VERSION="${VERSION#v}"
          curl -sSL -o devolay-upstream.jar "https://repo1.maven.org/maven2/me/walkerknapp/devolay/${VERSION}/devolay-${VERSION}.jar"
          mkdir -p repack/natives/macos/arm64-v8a
          cp devolay-upstream.jar repack/devolay.jar
          cp libdevolay-natives.dylib repack/natives/macos/arm64-v8a/
          (cd repack && zip -q devolay.jar natives/macos/arm64-v8a/libdevolay-natives.dylib)
          mkdir -p thirdparty
          # Version ".1" above upstream so it still satisfies the [2.1.0,3.0) range Gradle pins.
          cp repack/devolay.jar "thirdparty/devolay-${VERSION}.1.jar"
          unzip -l "thirdparty/devolay-${VERSION}.1.jar" | grep natives/
          echo "jar=thirdparty/devolay-${VERSION}.1.jar" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: devolay-macos-arm64
          path: |
            libdevolay-natives.dylib
            thirdparty/*.jar

      - name: Commit the repacked jar
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thirdparty/
          git commit -m "Devolay ${{ inputs.devolay_tag }} repacked with a macOS arm64 native" || echo "nothing to commit"
          git push
