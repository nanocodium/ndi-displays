plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.1.0-beta.1'
group = 'dev.nano.ndidisplays'

base {
    archivesName = 'ndidisplays-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def isWindows = osName.contains('win')
def isMac = osName.contains('mac') || osName.contains('darwin')

// --- NDI runtime discovery for the dev run configs ------------------------
// Devolay resolves the NDI runtime through NDI_RUNTIME_DIR_V5/V6 plus the
// platform's native library search path. Point both at a real install so
// `runClient` gets live video instead of "runtime not found".
// Override with -PndiRuntimeDir=<path>, or by exporting NDI_RUNTIME_DIR_V5.

/**
 * Filename of the NDI shared library on this platform. Windows ships an unversioned
 * DLL name across NDI 4/5/6; the Linux and macOS runtimes carry an soname major.
 */
def ndiLibPattern = isWindows ? ~/(?i)Processing\.NDI\.Lib\..*\.dll/
        : (isMac ? ~/libndi.*\.dylib/ : ~/libndi\.so.*/)

/** The NDI libraries actually present in a directory — empty when it merely exists. */
def ndiLibsIn = { dir ->
    def d = new File(dir as String)
    if (!d.isDirectory()) {
        return []
    }
    (d.listFiles() ?: new File[0]).findAll { it.name ==~ ndiLibPattern }
}

/**
 * Devolay 2.1.0's natives dlopen the literal soname `libndi.so.5`, so an NDI 6
 * install — which ships only `libndi.so.6` — never resolves and every screen goes
 * black with no error logged: the finder simply returns no sources forever. NDI 6
 * still exports `NDIlib_v3_load`, the entry point Devolay calls, so the runtime is
 * ABI-compatible and only the filename is wrong. Bridge it with a symlink under
 * build/ rather than asking for one in /usr/lib.
 *
 * Windows and macOS need no bridge: their runtime filenames carry no major version.
 */
def ndiCompatDirFor = { dir ->
    def libs = ndiLibsIn(dir)
    if (isWindows || isMac || libs.isEmpty() || libs.any { it.name == 'libndi.so.5' }) {
        return dir as String
    }
    // Prefer the plain soname (libndi.so.6) over a fully versioned file (libndi.so.6.3.2).
    def target = libs.findAll { it.name ==~ /libndi\.so\.\d+/ }.sort { it.name }.reverse()[0]
            ?: libs.find { it.name == 'libndi.so' }
    if (target == null) {
        return dir as String
    }
    def shim = new File(buildDir, 'ndi-shim')
    def link = new File(shim, 'libndi.so.5')
    try {
        shim.mkdirs()
        def linkPath = link.toPath()
        if (java.nio.file.Files.isSymbolicLink(linkPath)) {
            if (java.nio.file.Files.readSymbolicLink(linkPath).toString() == target.absolutePath) {
                return shim.absolutePath
            }
            java.nio.file.Files.delete(linkPath)
        } else if (link.exists()) {
            java.nio.file.Files.delete(linkPath)
        }
        java.nio.file.Files.createSymbolicLink(linkPath, target.toPath())
        logger.lifecycle("[ndidisplays] bridging Devolay's libndi.so.5 to ${target.name} via ${shim}")
        return shim.absolutePath
    } catch (Exception e) {
        logger.warn("[ndidisplays] could not link libndi.so.5 -> ${target.name} ({}); " +
                'NDI will not load — see README', e.toString())
        return dir as String
    }
}

def ndiRuntimeDir = {
    if (project.hasProperty('ndiRuntimeDir')) {
        return ndiCompatDirFor(project.property('ndiRuntimeDir').toString())
    }
    def fromEnv = System.getenv('NDI_RUNTIME_DIR_V6') ?: System.getenv('NDI_RUNTIME_DIR_V5')
    if (fromEnv) {
        return ndiCompatDirFor(fromEnv)
    }
    def home = System.getProperty('user.home')
    def candidates
    if (isWindows) {
        candidates = ['C:/Program Files/NDI/NDI 6 Runtime/v6',
                      'C:/Program Files/NDI/NDI 5 Runtime/v5',
                      'C:/Program Files/NewTek/NDI 5 Runtime/v5']
    } else if (isMac) {
        candidates = ['/usr/local/lib', "$home/.local/lib/ndi"]
    } else {
        candidates = ["$home/.local/lib/ndi", '/usr/local/lib', '/usr/lib']
    }
    // A directory that merely exists is not an NDI install: /usr/local/lib is present on
    // most Linux boxes and usually holds no NDI at all, which used to be reported as found.
    def withLib = candidates.find { !ndiLibsIn(it).isEmpty() }
    return withLib ? ndiCompatDirFor(withLib) : candidates[0]
}()

/** Native library search path variable for the current platform. */
def ndiLibPathVar = isWindows ? 'PATH' : (isMac ? 'DYLD_LIBRARY_PATH' : 'LD_LIBRARY_PATH')

logger.lifecycle("[ndidisplays] NDI runtime dir: ${ndiRuntimeDir}" +
        (ndiLibsIn(ndiRuntimeDir).isEmpty() ? ' (no NDI library there — walls will show test patterns)' : ''))

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            // Let third-party mods' mixins apply in this dev runtime.
            //
            // A mod built for the launcher ships a refmap of SRG names (Minecraft.m_91152_ and
            // friends). This runtime uses official names, so those @Shadow targets do not exist
            // and the mixin fails hard — which is exactly how MCEF killed the dev client. fg.deobf
            // rewrites bytecode but not refmaps; Mixin can remap them itself given the SRG to
            // official table, which ForgeGradle has already generated for its own use.
            def srgToOfficial = fileTree(dir: "${buildDir}/fg_cache", include: '**/srg_to_official_*.tsrg')
                    .files.find { it.exists() }
            if (srgToOfficial != null) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', srgToOfficial.absolutePath
            }
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            environment 'NDI_RUNTIME_DIR_V5', ndiRuntimeDir
            environment 'NDI_RUNTIME_DIR_V6', ndiRuntimeDir
            environment ndiLibPathVar, (System.getenv(ndiLibPathVar)
                    ? "${ndiRuntimeDir}${File.pathSeparator}${System.getenv(ndiLibPathVar)}"
                    : ndiRuntimeDir.toString())
            mods {
                ndidisplays {
                    source sourceSets.main
                }
            }
        }
        client {
            // Jump straight into a singleplayer world instead of stopping at the main
            // menu — handy when iterating on the wall/camera rendering:
            //   gradlew.bat runClient -PquickPlay="NDI TEST"
            // The value is the level folder name under run/saves/.
            if (project.hasProperty('quickPlay')) {
                args '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
            // gradlew.bat runClient -PdebugCapture — logs each camera rig's real capture
            // geometry (eye position, aim, fov) alongside the player's position, so a
            // mis-framed feed can be checked against the world rather than eyeballed.
            if (project.hasProperty('debugCapture')) {
                property 'ndidisplays.debugCapture', 'true'
            }
            // gradlew.bat runClient -PperfLog — reports game fps, per-capture cost, the
            // adaptive capture budget and each watched rig's delivered frame rate.
            if (project.hasProperty('perfLog')) {
                property 'ndidisplays.perfLog', 'true'
            }
            // Pass through the capture tunables so they can be swept without editing code:
            //   -PcapturesPerFrame=3 -PmaxCapturesPerFrame=6 -PtargetGameFps=60
            ['capturesPerFrame', 'maxCapturesPerFrame', 'targetGameFps'].each { key ->
                if (project.hasProperty(key)) {
                    property "ndidisplays.${key}", project.property(key).toString()
                }
            }
        }
        server {
            args '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.firstdarkdev.xyz/snapshots' }
    // Theatrical (DMX/Art-Net stage lighting) — for the kinetic winch fixture integration.
    maven { url = 'https://mvn.imabad.dev/repository/maven-releases/' }
    maven { url = 'https://jitpack.io' }
}

jarJar.enable()

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    minecraftLibrary 'me.walkerknapp:devolay:2.1.0'
    jarJar('me.walkerknapp:devolay:[2.1.0,3.0)') {
        jarJar.pin(it, '2.1.0')
    }

    // Optional bloom integration (compile-only: Shimmer's production mixins can't
    // apply in the mojmap dev runtime; the integration activates in a real launcher
    // when Shimmer is installed). Transitives off — its pom references unresolvable deps.
    compileOnly fg.deobf(project.dependencies.create('com.lowdragmc.shimmer:Shimmer-forge:1.20.1-0.2.4') { transitive = false })

    // Optional Theatrical integration: kinetic winch panels register as patchable DMX
    // fixtures (16-bit height + speed + dimmer) on a Theatrical network. Compile-only —
    // all Theatrical-touching code lives behind compat classes that only load when the
    // mod is present at runtime.
    //
    // The API compiled against is the local Theatrical-official-1.20.1 build when
    // present (it has the current networks API — TheatricalNetworkData/network.dmx() —
    // which is what the locally-built Theatrical jar in use actually ships). The Maven
    // alpha.28 artifact is years of API behind (old dmx.DMXNetworkData) and is only a
    // fallback so the project still compiles on a machine without the local checkout.
    // artnet4j is needed because DMXConsumer's signature references RDMDeviceId.
    def theatricalLocalClasses = file("${rootDir}/../Theatrical-official-1.20.1/common/build/classes/java/main")
    if (theatricalLocalClasses.isDirectory()) {
        compileOnly files(theatricalLocalClasses)
    } else {
        compileOnly fg.deobf(project.dependencies.create('dev.imabad:Theatrical-forge:1.0.0-alpha.28.120+mc1.20.1') { transitive = false })
    }
    compileOnly 'ch.bildspur:artnet4j:0.6.3'

    // MCEF, for the web terminal's embedded browser. Dev-runtime only and deliberately not a
    // compile dependency: WebBrowsers reaches it purely by reflection, so the mod builds and
    // loads without it. It is only here so the dev client actually has a browser to talk to.
    //
    // fg.deobf because a production mod jar is mapped for the launcher, not for this runtime;
    // dropping it in run/mods unremapped would fail to link against Minecraft's dev names.
    // Read from libs/ rather than a Maven, because MCEF publishes to neither Maven Central nor
    // a reachable repo — put the jar there (it is gitignored) or the block simply reports that
    // no browser is available.
    fileTree(dir: 'libs', include: 'mcef-forge-*.jar').each { mcefJar ->
        runtimeOnly fg.deobf(files(mcefJar))
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'ndidisplays',
                'Specification-Vendor'    : 'nano',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'nano'
        ])
    }
}

jar.finalizedBy('reobfJar')
tasks.named('jarJar') { finalizedBy 'reobfJarJar' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
